name: Run Script and Push TXT Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run script
        run: python3 send_cli.py

            git commit -m "Add/update .txt files from workflow run"
            git push
          fi
